[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localesafe"
version = "0.2.0"
description = "Separate language, locale, and workflow failures in service agents"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
localesafe = "localesafe.cli:main"

[tool.setuptools.packages.find]
include = ["localesafe*"]
